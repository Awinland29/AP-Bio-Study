name: Biosphere study assessment checks
on:
  pull_request:
  workflow_dispatch:

jobs:
  assessment-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AP_Biology_Study_Platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app and test dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Compile Python sources
        run: python -m compileall -q main.py study_bank3.py study_extras.py
      - name: Check browser JavaScript syntax
        run: node --check static/app.js
      - name: Run assessment and regression tests
        run: python -m pytest -q tests/test_exam_structure.py tests/test_quality_unit3.py tests/test_audit_fixes.py tests/test_workflows.py
